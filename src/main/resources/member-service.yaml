server:
  port: 8081

spring:
  application:
    name: member-service
  datasource:
    url: jdbc:h2:mem:member;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  # Consul 설정 (spring 블록 안에 있어야 키가 중복되지 않음)
#  cloud:
#    consul:
#      host: localhost
#      port: 18500
#      discovery:
        # Consul이 이 경로를 주기적으로 호출하여 건강 상태를 체크
#        health-check-path: /actuator/health
        # 헬스 체크 주기
#        health-check-interval: 15s
        # 서비스 ID를 고유하게 만들어 동일 호스트에서 여러 인스턴스 실행 가능
#        instance-id: ${spring.application.name}:${random.value}

eureka:
  client:
    service-url:
      # 2. Eureka 서버(들)의 주소.
      defaultZone: http://localhost:8761/eureka/
  instance:
    # 3. IP 주소로 등록되도록 설정
    prefer-ip-address: true


