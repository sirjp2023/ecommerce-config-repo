spring:
  datasource:
    url: jdbc:h2:mem:member;DB_CLOSE_DELAY=-1 # 개발 환경에서는 H2 DB 사용
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
member:
  greeting: "Hello, Dev Member!" # 개발 환경용 인사말
